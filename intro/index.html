<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>We Better Intro</title>
    <!-- Fonts specified in DESIGN.md -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap');

      body, html {
        margin: 0;
        padding: 0;
        background: #1A1620; /* --text-primary as initial dark bg */
        overflow: hidden;
      }

      /* Composition styling */
      [data-composition-id="we-better-intro"] {
        position: relative;
        background-color: #1A1620;
      }

      /* Scene container fills comp width/height */
      .scene-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 120px;
        box-sizing: border-box;
        z-index: 10;
      }

      .bg-video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(26, 22, 32, 0.5); /* --text-primary with opacity */
        z-index: 2;
      }

      .title {
        font-family: 'Outfit', sans-serif;
        font-size: 140px;
        font-weight: 700;
        color: #FCFAFC; /* --bg-primary */
        margin: 0;
        text-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
      }

      .subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 48px;
        font-weight: 400;
        color: #E8A598; /* --accent-secondary */
        margin-top: 24px;
        letter-spacing: 4px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="we-better-intro" data-width="1920" data-height="1080" data-start="0" data-duration="10">
      
      <!-- Video Track (Track 0) -->
      <video
        id="bg-vid"
        class="bg-video clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        src="assets/bg.mp4"
        muted
        playsinline
      ></video>
      
      <!-- Audio Track (Track 1) -->
      <audio
        id="bg-aud"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        src="assets/bg.mp3"
        data-volume="0.8"
      ></audio>

      <!-- Overlay (Track 2) -->
      <div id="overlay" class="overlay clip" data-start="0" data-duration="10" data-track-index="2"></div>

      <!-- Main content (Track 3) -->
      <div id="scene-layer" class="scene-content clip" data-start="0" data-duration="10" data-track-index="3">
        <h1 id="intro-title" class="title">We Better</h1>
        <p id="intro-subtitle" class="subtitle">Grow Together</p>
      </div>

    </div>

    <!-- GSAP for animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Entrances (Starts slightly after 0 to follow house rules) // Background fade
      tl.from("#bg-vid", { opacity: 0, duration: 2.0, ease: "linear" }, 0.1);
      tl.from("#overlay", { opacity: 0, duration: 2.0, ease: "linear" }, 0.1);
      
      // Text fade and subtle y-movement
      tl.from("#intro-title", { 
        y: 60, 
        opacity: 0, 
        duration: 1.5, 
        ease: "power3.out" 
      }, 1.0);
      
      tl.from("#intro-subtitle", { 
        y: 40, 
        opacity: 0, 
        duration: 1.2, 
        ease: "power2.out" 
      }, 1.5);

      // Simple ambient scale on background
      tl.from("#bg-vid", {  scale: 1.05, duration: 10, ease: "none" }, 0);

      // Exits - fade to black at the end
      tl.to(["#intro-title", "#intro-subtitle", "#overlay", "#bg-vid"], { 
        opacity: 0, 
        duration: 1.5, 
        ease: "power2.inOut" 
      }, 8.5);

      window.__timelines["we-better-intro"] = tl;
    </script>
  </body>
</html>
